# Pull requests and pushes to main: build the docs site (strict).
# Published releases and manual runs: build, then deploy to GitHub Pages.
name: Docs

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        # Pin uv. `uv lock --refresh` rewrites the lockfile in the running
        # uv's format, and the hermetic `--locked` check then fails. Bump this
        # only in the same commit that regenerates uv.lock with that uv.
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.12.22"
          enable-cache: true

      - name: Install docs dependencies
        # --frozen: fail if uv.lock is out of date with pyproject.toml.
        # --no-config: user-level uv indexes must not take part.
        run: uv sync --group docs --frozen --no-config

      - name: Lock is hermetic
        run: uv lock --locked --refresh --no-config

      - name: Build site (strict)
        run: uv run --no-config properdocs build --strict

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
